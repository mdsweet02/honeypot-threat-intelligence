title: Download and Execute Chain (wget/curl then chmod/sh)
id: 7b1e2a3c-4d5e-4f60-8a71-9b2c3d4e5f03
status: experimental
description: |
  Classic IoT/Linux botnet dropper: fetch a script with wget/curl/tftp, make it
  executable and run it, often from /tmp, all in one command line.
  Kibana KQL equivalent:
    eventid:"cowrie.command.input" and (input:*wget* or input:*curl* or input:*tftp*) and (input:*chmod* or input:*"sh "*)
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1059/004/
author: Madina Zhakina
date: 2026-11-08
tags:
  - attack.command_and_control
  - attack.t1105
  - attack.execution
  - attack.t1059.004
logsource:
  product: cowrie
  service: honeypot
detection:
  selection_event:
    eventid: cowrie.command.input
  selection_download:
    input|contains:
      - 'wget '
      - 'curl '
      - 'tftp '
  selection_exec:
    input|contains:
      - 'chmod '
      - 'sh '
      - '| sh'
      - '|sh'
  condition: selection_event and selection_download and selection_exec
fields:
  - src_ip
  - input
falsepositives:
  - Install scripts run by admins on real servers (curl | sh)
level: high
