title: SSH Authorized Keys Modified in Honeypot Session
id: 7b1e2a3c-4d5e-4f60-8a71-9b2c3d4e5f01
status: experimental
description: |
  Attacker writes their own public key into ~/.ssh/authorized_keys to keep access
  even if the password changes. Observed on the Cowrie honeypot, commonly together
  with "chattr -ia .ssh" and the "mdrfckr" key comment (Outlaw/Dota botnet).
  Kibana KQL equivalent:  eventid:"cowrie.command.input" and input:*authorized_keys*
references:
  - https://attack.mitre.org/techniques/T1098/004/
author: Madina Zhakina
date: 2026-11-08
tags:
  - attack.persistence
  - attack.t1098.004
logsource:
  product: cowrie
  service: honeypot
detection:
  selection:
    eventid: cowrie.command.input
    input|contains: authorized_keys
  condition: selection
fields:
  - src_ip
  - session
  - input
falsepositives:
  - None on a honeypot. On real servers, admins adding keys (correlate with user/session).
level: high
